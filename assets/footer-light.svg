<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
<title id="title">What's next: got a product to build, or an ERP to pilot? Write to saadasamir449@gmail.com</title>
<style>
.sans{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,'Noto Sans Arabic',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Code','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect width="1200" height="300" rx="24" fill="#fafafa"/>
<defs><clipPath id="frame"><rect width="1200" height="300" rx="24"/></clipPath></defs>
<g clip-path="url(#frame)"><defs>
<pattern id="fdots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d4d4d8"/></pattern>
<radialGradient id="fdots-fade" cx="0.85" cy="0.3" r="0.75"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="fdots-mask"><rect width="1200" height="300" fill="url(#fdots-fade)"/></mask>
<radialGradient id="fdots-glow" cx="0.85" cy="0.3" r="0.55"><stop offset="0" stop-color="#c6f135" stop-opacity="0.32"/><stop offset="1" stop-color="#c6f135" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="300" fill="url(#fdots)" mask="url(#fdots-mask)"/>
<rect width="1200" height="300" fill="url(#fdots-glow)"/></g>
<rect x=".5" y=".5" width="1199" height="299" rx="23.5" fill="none" stroke="#e4e4e7"/>
<text x="64" y="84" class="mono" font-size="13" fill="#3f6212" textLength="85.8" lengthAdjust="spacing" letter-spacing="1">WHAT'S NEXT</text>
<text x="60" y="152" class="sans" font-size="54" font-weight="700" letter-spacing="-1.6" fill="#0a0a0b">Got a product to build,</text>
<text x="60" y="214" class="sans" font-size="54" font-weight="700" letter-spacing="-1.6" fill="#0a0a0b">or an ERP to pilot<tspan fill="#65a30d">?</tspan></text>
<text x="64" y="258" class="mono" font-size="15" fill="#52525b" textLength="207" lengthAdjust="spacing" >saadasamir449@gmail.com</text>
<text x="896.8" y="258" class="mono" font-size="12" fill="#71717a" textLength="187.2" lengthAdjust="spacing" >À BIENTÔT · SEE YOU SOON ·</text>
<text x="1136" y="258" class="sans" font-size="14" text-anchor="end" fill="#71717a">إلى اللقاء</text>

</svg>
