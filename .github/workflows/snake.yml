name: Contribution snake

# Manual run only: the contribution graph is not shown in the README for now.
# Re-enable the daily schedule when it is added back.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Snake colours follow the profile palette: lime accent on neutral greys.
      - name: Generate the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#4d7c0f&color_dots=#ebedf0,#d9f99d,#a3e635,#65a30d,#3f6212
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c6f135&color_dots=#161b22,#2b3a10,#4d6b16,#86b324,#c6f135
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
